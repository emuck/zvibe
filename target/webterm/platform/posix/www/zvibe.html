<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zvibe</title>
<style>
:root { --mapw: 42%; --maph: 32vh; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #0e0e0e;
    color: #c8c8c8;
    font: 14px/1.6 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
#toolbar {
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
}
#status-bar {
    background: #151515;
    border-bottom: 1px solid #222;
    padding: 3px 10px;
    font-size: 12px;
    color: #888;
    flex-shrink: 0;
    min-height: 22px;
}
#main {
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
}
#term {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
#output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    white-space: pre-wrap;
    word-break: break-word;
}
#input-bar {
    border-top: 1px solid #2a2a2a;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

/* ── map split ── */
#gutter {
    width: 7px; cursor: col-resize; flex: none;
    background: linear-gradient(90deg, transparent 2px, #2a2a2a 3px,
                #2a2a2a 4px, transparent 5px);
}
#gutter:hover {
    background: linear-gradient(90deg, transparent 2px, #3a3 3px,
                #3a3 4px, transparent 5px);
}
#cart-stage {
    flex: none; width: var(--mapw); min-width: 260px;
}
body.map-hidden #cart-stage, body.map-hidden #gutter { display: none; }

#maptoggle.attn { color: #3a3; border-color: #3a3; }

@media (max-width: 880px) {
    #main { flex-direction: column-reverse; }
    #gutter {
        width: auto; height: 7px; cursor: row-resize;
        background: linear-gradient(180deg, transparent 2px, #2a2a2a 3px,
                    #2a2a2a 4px, transparent 5px);
    }
    #gutter:hover {
        background: linear-gradient(180deg, transparent 2px, #3a3 3px,
                    #3a3 4px, transparent 5px);
    }
    #cart-stage {
        width: auto; min-width: 0;
        height: var(--maph, 32vh); min-height: 130px;
    }
}
/* ── version 4 screen (zterm.js) ── */
#screen {
    flex: 1; overflow: auto; padding: 8px 14px;
    font: 14px/1.3 'Courier New', Courier, monospace;
}
#screen[hidden], #output[hidden], #input-bar[hidden] { display: none; }
.zrow { white-space: pre; height: 1.3em; }
.zrev  { background: #c8c8c8; color: #0e0e0e; }
.zbold { font-weight: bold; color: #fff; }
.zrev.zbold { color: #000; }
.zul   { text-decoration: underline; }
.zcur  { background: #3a3; color: #000; animation: zblink 1.1s steps(1) infinite; }
@keyframes zblink { 50% { background: transparent; color: inherit; } }
#prompt-char { color: #3a3; user-select: none; }
#input-field {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #d0d0d0;
    font: inherit;
    caret-color: #3a3;
}
.msg-sys  { color: #555; }
.msg-err  { color: #844; }
.msg-echo { color: #668; }

select, button {
    background: #252525;
    color: #aaa;
    border: 1px solid #3a3a3a;
    padding: 3px 8px;
    font: 12px/1.4 'Courier New', monospace;
    cursor: pointer;
}
select:focus, button:hover { border-color: #666; outline: none; background: #2e2e2e; }
#game-select { max-width: 220px; }
#btn-reset   { margin-left: auto; }
</style>
</head>
<body>

<div id="toolbar">
    <select id="game-select"><option value="">-- select game --</option></select>
    <button id="btn-load">Load</button>
    <button id="btn-save">Save</button>
    <button id="btn-restore">Restore</button>
    <button id="maptoggle">Hide map</button>
    <button id="btn-reset">Reset</button>
</div>
<div id="status-bar"></div>
<div id="main">
    <div id="term">
        <div id="screen" hidden></div>
        <div id="output"></div>
        <div id="input-bar">
            <span id="prompt-char">&gt;</span>
            <input id="input-field" type="text" autocomplete="off"
                   spellcheck="false" disabled placeholder="waiting...">
        </div>
    </div>
    <div id="gutter" aria-hidden="true"></div>
    <div id="cart-stage"></div>
</div>

<script src="cartographer.js"></script>
<script src="zterm.js"></script>
<script>
(function () {
'use strict';

const output    = document.getElementById('output');
const inputEl   = document.getElementById('input-field');
const promptEl  = document.getElementById('prompt-char');
const statusEl  = document.getElementById('status-bar');
const picker    = document.getElementById('game-select');
const cartStage = document.getElementById('cart-stage');
const mapToggle = document.getElementById('maptoggle');

const cart = new Cartographer(cartStage);

/* A version 4 story draws its own screen: the server sends terminal bytes in
 * "screen" frames and zterm.js draws them (and takes the keys; see zterm.js). */
const screenEl = document.getElementById('screen');
const inputBar = document.getElementById('input-bar');
let screenOn = false;
const term = new ZTerm(screenEl, msg => send(msg));

function showScreen(on) {
    screenOn = on;
    screenEl.hidden = !on;
    output.hidden = on;
    inputBar.hidden = on;
    if (!on) term.setWait(null);
}

/* Messages go to the status bar while the screen is up (the log is hidden). */
function notice(text, cls) {
    if (screenOn) statusEl.textContent = text.trim();
    else print(text, cls);
}

let ws = null;

/* ── map pane: toggle, resize gutter, hidden-update pulse ── */
mapToggle.addEventListener('click', () => {
    const hidden = document.body.classList.toggle('map-hidden');
    mapToggle.textContent = hidden ? 'Show map' : 'Hide map';
    if (hidden) cart.hide(); else cart.show();
});

/* ── map persistence: localStorage, keyed by story identity ──
 * See CARTOGRAPHER.md § Persistence. cartKey is set from the "story"
 * message (sent on load and on resume); until then, cart state isn't
 * saved. Writes are debounced so rapid movement doesn't hammer storage. */
let cartKey = null;
let cartSaveTimer = null;

function cartScheduleSave() {
    if (!cartKey) return;
    clearTimeout(cartSaveTimer);
    cartSaveTimer = setTimeout(() => {
        try { localStorage.setItem(cartKey, JSON.stringify(cart.serialize())); }
        catch { /* storage full or unavailable — persistence is best-effort */ }
    }, 500);
}

cartStage.addEventListener('cart:update', e => {
    if (e.detail.hidden) {
        mapToggle.classList.add('attn');
        setTimeout(() => mapToggle.classList.remove('attn'), 700);
    }
    cartScheduleSave();
});

(function bindGutter() {
    const gutter = document.getElementById('gutter');
    let dragging = false;
    gutter.addEventListener('pointerdown', e => {
        dragging = true; e.preventDefault();
        gutter.setPointerCapture(e.pointerId);
    });
    gutter.addEventListener('pointermove', e => {
        if (!dragging) return;
        const root = document.documentElement.style;
        if (matchMedia('(max-width: 880px)').matches) {
            const main = document.getElementById('main').getBoundingClientRect();
            const h = Math.min(Math.max(e.clientY - main.top, 130), main.height * 0.7);
            root.setProperty('--maph', h + 'px');
        } else {
            const w = Math.min(Math.max(innerWidth - e.clientX, 260), innerWidth * 0.7);
            root.setProperty('--mapw', w + 'px');
        }
    });
    gutter.addEventListener('pointerup', () => dragging = false);
})();

function print(text, cls) {
    const el = document.createElement('span');
    if (cls) el.className = cls;
    el.textContent = text;
    output.appendChild(el);
    output.scrollTop = output.scrollHeight;
}

function setInput(on) {
    inputEl.disabled = !on;
    promptEl.style.color = on ? '#3a3' : '#333';
    if (on) { inputEl.placeholder = ''; inputEl.focus(); }
    else inputEl.placeholder = 'waiting...';
}

function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/zvibe`);

    ws.addEventListener('open', () => {
        print('Connected.\n', 'msg-sys');
        send({ type: 'games' });
    });

    ws.addEventListener('close', () => {
        setInput(false);
        term.setWait(null);
        print('\nDisconnected. Reconnecting...\n', 'msg-sys');
        ws = null;
        setTimeout(connect, 3000);
    });

    ws.addEventListener('error', () => print('\nSocket error.\n', 'msg-err'));

    ws.addEventListener('message', ({ data }) => {
        let msg;
        try { msg = JSON.parse(data); } catch { print(data); return; }

        switch (msg.type) {
            case 'screen':
                if (msg.reset) { showScreen(true); statusEl.textContent = ''; term.reset(msg.rows, msg.cols); }
                if (msg.data) term.write(msg.data);
                if (msg.key) term.setWait('key');
                else if (msg.prompt) term.setWait('line');
                break;

            case 'output':
                showScreen(false);
                print(msg.text);
                setInput(!!msg.prompt);
                break;

            case 'room':
                cart.observe(msg.cmd, msg.id, msg.name);
                break;

            case 'story':
                cartKey = `cart:${msg.release}-${msg.serial}-${msg.checksum}`;
                try {
                    const saved = localStorage.getItem(cartKey);
                    if (saved) cart.restore(JSON.parse(saved));
                } catch { /* corrupt or unavailable storage — start empty */ }
                break;

            case 'status': {
                const loc   = msg.location || '';
                const right = (msg.hours !== undefined)
                    ? `${msg.hours}:${String(msg.minutes).padStart(2, '0')}`
                    : `Score: ${msg.score}   Turns: ${msg.turns}`;
                statusEl.textContent = loc ? `${loc}   ${right}` : right;
                break;
            }

            case 'games': {
                const prev = picker.value;
                while (picker.options.length > 1) picker.remove(1);
                (msg.list || []).slice().sort().forEach(g => picker.add(new Option(g, g)));
                if (prev && [...picker.options].some(o => o.value === prev)) picker.value = prev;
                break;
            }

            case 'busy':
                print('A session is already in progress on this device.\n', 'msg-err');
                break;

            case 'resumed':
                if (screenOn) break;                    // the replay redraws the screen
                print('\n-- session resumed --\n', 'msg-sys');
                setInput(!!msg.prompt);
                break;

            case 'saved':
                notice('\n[Saved.]\n', 'msg-sys');
                if (!screenOn) setInput(true);
                break;

            case 'error':
                notice(`\n[${msg.message}]\n`, 'msg-err');
                if (!screenOn) setInput(true);
                break;
        }
    });
}

inputEl.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const text = inputEl.value;
    print(` ${text}\n`, 'msg-echo');
    send({ type: 'input', text });
    inputEl.value = '';
    setInput(false);
});

document.getElementById('btn-load').addEventListener('click', () => {
    const g = picker.value;
    if (!g) return;
    output.textContent = '';
    statusEl.textContent = '';
    showScreen(false);
    setInput(false);
    cart.reset();
    send({ type: 'load', game: g });
});

document.getElementById('btn-save').addEventListener('click', () => send({ type: 'save' }));

document.getElementById('btn-restore').addEventListener('click', () => send({ type: 'restore' }));

document.getElementById('btn-reset').addEventListener('click', () => {
    if (!confirm('Reset session? Game progress will be lost.')) return;
    output.textContent = '';
    statusEl.textContent = '';
    showScreen(false);
    setInput(false);
    cart.reset();
    send({ type: 'reset' });
    send({ type: 'games' });
});

connect();
}());
</script>
</body>
</html>
